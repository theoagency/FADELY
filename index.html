<!DOCTYPE html>
<html lang="fr" x-data="fadelyApp()" x-init="initAutoReminders(); initPWA();" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FADELY - L'Agenda Pro des Coiffeurs & Barbiers Indépendants</title>
    
    <!-- PWA / Mobile Meta Tags -->
    <meta name="theme-color" content="#2563EB">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FADELY">
    
    <!-- Dynamic Manifest PWA -->
    <link rel="manifest" id="pwa-manifest">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#2563EB',
                            dark: '#1D4ED8',
                            light: '#EFF6FF'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Stripe.js -->
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col font-sans pb-24 sm:pb-0">

    <!-- HEADER / NAVIGATION -->
    <header class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md shadow-sm sticky top-0 z-50 transition">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" @click="currentView = 'home'">
                <div class="bg-primary text-white p-2.5 rounded-2xl font-black text-xl tracking-wider shadow-md shadow-blue-500/20">F</div>
                <span class="text-2xl font-black tracking-tight text-primary dark:text-blue-400" x-text="salon.name || 'FADELY'">FADELY</span>
            </div>
            <div class="flex items-center space-x-4">
                <!-- Sélecteur de langue -->
                <select x-model="selectedLang" class="bg-gray-100 dark:bg-gray-700 text-xs font-bold px-3 py-2 rounded-xl border-0 cursor-pointer hover:bg-gray-200 transition">
                    <option value="fr">🇫🇷 FR</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="nl">🇳🇱 NL</option>
                    <option value="de">🇩🇪 DE</option>
                    <option value="es">🇪🇸 ES</option>
                    <option value="it">🇮🇹 IT</option>
                </select>

                <button @click="darkMode = !darkMode" class="p-2.5 rounded-xl bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition">
                    <svg x-show="!darkMode" class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    <svg x-show="darkMode" class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </button>

                <template x-if="currentView === 'home'">
                    <div class="flex items-center space-x-3">
                        <button @click="currentView = 'login'" class="text-xs font-bold hover:text-primary transition px-3 py-2" x-text="t('login')">Connexion</button>
                        <button @click="currentView = 'register'" class="bg-primary hover:bg-primary-dark text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-lg shadow-blue-500/30 transition transform hover:-translate-y-0.5" x-text="t('freeTrial')">Créer votre espace (5j offerts)</button>
                    </div>
                </template>
                <template x-if="currentView !== 'home' && currentView !== 'public_booking'">
                    <button @click="currentView = 'home'" class="text-xs font-bold text-gray-500 hover:text-red-500 transition px-3 py-2" x-text="t('logout')">Déconnexion</button>
                </template>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-grow">

        <!-- 1. PAGE D'ACCUEIL -->
        <template x-if="currentView === 'home'">
            <div class="space-y-20 pb-20">
                <section class="relative overflow-hidden pt-12 pb-16 md:py-24">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                            
                            <div class="lg:col-span-7 space-y-8 text-center lg:text-left">
                                <div class="inline-flex items-center space-x-2 bg-blue-50 dark:bg-blue-950/60 border border-blue-200 dark:border-blue-800 text-primary dark:text-blue-300 text-xs font-bold px-4 py-2 rounded-full shadow-sm">
                                    <span x-text="t('heroBadge')">✂️ La Plateforme N°1 des Artisans Indépendants</span>
                                </div>
                                
                                <h1 class="text-4xl sm:text-6xl font-black tracking-tight leading-tight">
                                    <span x-text="t('heroTitle1')">Remplissez votre agenda</span> <br>
                                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 dark:from-blue-400 dark:to-indigo-400" x-text="t('heroTitle2')">sans perdre une minute.</span>
                                </h1>
                                
                                <p class="text-base sm:text-lg text-gray-600 dark:text-gray-300 max-w-2xl mx-auto lg:mx-0 leading-relaxed" x-text="t('heroDesc')">
                                    Une réservation en ligne ultra-simple avec **votre propre lien unique**, zéro doublon, rappels SMS automatiques et créneaux sur-mesure (15, 20, 30 min...).
                                </p>

                                <div class="flex flex-col sm:flex-row justify-center lg:justify-start items-center space-y-3 sm:space-y-0 sm:space-x-4">
                                    <button @click="currentView = 'register'" class="w-full sm:w-auto bg-primary hover:bg-primary-dark text-white px-8 py-4 rounded-2xl font-bold text-sm shadow-xl shadow-blue-500/30 transition transform hover:-translate-y-1" x-text="t('testFree')">
                                        Tester gratuitement pendant 5 jours 🚀
                                    </button>
                                    <button @click="currentView = 'public_booking'" class="w-full sm:w-auto bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 text-gray-800 dark:text-gray-100 px-8 py-4 rounded-2xl font-bold text-sm border border-gray-200 dark:border-gray-700 transition" x-text="t('seeDemo')">
                                        Voir la démo client 📱
                                    </button>
                                </div>

                                <div class="pt-4 flex flex-wrap justify-center lg:justify-start gap-6 text-xs font-semibold text-gray-500 dark:text-gray-400">
                                    <div class="flex items-center space-x-2">
                                        <span class="text-green-500 font-bold">✓</span>
                                        <span x-text="t('featureCommitment')">Sans engagement</span>
                                    </div>
                                    <div class="flex items-center space-x-2">
                                        <span class="text-green-500 font-bold">✓</span>
                                        <span x-text="t('featureSetup')">Configuration en 2 min</span>
                                    </div>
                                    <div class="flex items-center space-x-2">
                                        <span class="text-green-500 font-bold">✓</span>
                                        <span x-text="t('featureSupport')">Support International (+32, +33...)</span>
                                    </div>
                                </div>
                            </div>

                            <div class="lg:col-span-5 max-w-md mx-auto w-full">
                                <div class="bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-2xl border-2 border-primary relative space-y-6">
                                    <div class="absolute -top-3.5 right-6 bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-[11px] font-extrabold uppercase tracking-wider px-4 py-1 rounded-full shadow-md" x-text="t('independentEdition')">
                                        Édition Indépendante Pro
                                    </div>
                                    
                                    <div class="space-y-2">
                                        <span class="text-xs font-bold uppercase tracking-wider text-primary" x-text="t('allInclusive')">Offre Tout Inclus</span>
                                        <h3 class="text-3xl font-black">49,99 € <span class="text-xs font-normal text-gray-400" x-text="t('perMonth')">/ mois</span></h3>
                                        <p class="text-xs text-gray-500" x-text="t('billedAfter')">Facturé après vos 5 jours d'essai gratuit.</p>
                                    </div>

                                    <div class="border-t border-b dark:border-gray-700 py-4 space-y-3 text-xs font-medium">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-5 h-5 bg-blue-100 text-primary rounded-full flex items-center justify-center font-bold text-[10px]">✓</div>
                                            <span x-text="t('planFeat1')">Lien unique personnalisable (Instagram / TikTok)</span>
                                        </div>
                                        <div class="flex items-center space-x-3">
                                            <div class="w-5 h-5 bg-blue-100 text-primary rounded-full flex items-center justify-center font-bold text-[10px]">✓</div>
                                            <span x-text="t('planFeat2')">Gestion 100% Anti-Doublons en temps réel</span>
                                        </div>
                                        <div class="flex items-center space-x-3">
                                            <div class="w-5 h-5 bg-blue-100 text-primary rounded-full flex items-center justify-center font-bold text-[10px]">✓</div>
                                            <span x-text="t('planFeat3')">Pause de midi & Congés programmables</span>
                                        </div>
                                        <div class="flex items-center space-x-3">
                                            <div class="w-5 h-5 bg-blue-100 text-primary rounded-full flex items-center justify-center font-bold text-[10px]">✓</div>
                                            <span x-text="t('planFeat4')">Rappels automatiques par SMS</span>
                                        </div>
                                    </div>

                                    <button @click="currentView = 'register'" class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-3.5 rounded-xl shadow-lg transition" x-text="t('createSalonBtn')">
                                        Créer Votre Salon Maintenant 🚀
                                    </button>
                                </div>
                            </div>

                        </div>
                    </div>
                </section>
            </div>
        </template>

        <!-- 1.5 CONNEXION -->
        <template x-if="currentView === 'login'">
            <div class="max-w-md mx-auto px-4 py-16">
                <div class="bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-2xl border border-gray-100 dark:border-gray-700 space-y-6">
                    <div class="text-center space-y-2">
                        <div class="w-14 h-14 bg-primary text-white rounded-2xl flex items-center justify-center font-bold text-xl shadow-lg mx-auto">🔐</div>
                        <h2 class="text-2xl font-black" x-text="t('loginTitle')">Connexion Professionnelle</h2>
                    </div>

                    <form @submit.prevent="loginCoiffeur()" class="space-y-4 text-xs">
                        <div>
                            <label class="block font-bold mb-1" x-text="t('emailLabel')">Email pro :</label>
                            <input type="email" x-model="loginData.email" required class="w-full px-4 py-3 rounded-xl border dark:bg-gray-700">
                        </div>
                        <div>
                            <label class="block font-bold mb-1" x-text="t('passwordLabel')">Mot de passe :</label>
                            <input type="password" x-model="loginData.password" required class="w-full px-4 py-3 rounded-xl border dark:bg-gray-700">
                        </div>
                        <button type="submit" class="w-full bg-primary text-white font-bold py-3.5 rounded-xl shadow transition" x-text="t('connectBtn')">Se connecter 🚀</button>
                    </form>
                </div>
            </div>
        </template>

        <!-- 2. INSCRIPTION & CONFIGURATION -->
        <template x-if="currentView === 'register'">
            <div class="max-w-2xl mx-auto px-4 py-12">
                <div class="bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-2xl border space-y-8">
                    <div class="text-center space-y-2">
                        <span class="bg-blue-100 dark:bg-blue-900/50 text-primary text-xs font-bold px-3 py-1 rounded-full" x-text="t('configAssistant')">Assistant de Configuration Professionnelle</span>
                        <h2 class="text-3xl font-black" x-text="t('configureSalon')">Configurez votre salon FADELY</h2>
                        <p class="text-xs text-gray-500">5 jours d'essai gratuit, puis 49,99 €/mois. Annulable à tout moment.</p>
                    </div>

                    <form @submit.prevent="finishRegistration()" class="space-y-6 text-xs">
                        <div class="p-5 bg-gray-50 dark:bg-gray-700/40 rounded-2xl border space-y-4">
                            <h3 class="font-bold text-sm text-primary uppercase" x-text="t('step1Info')">1. Vos Informations & Téléphone</h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block font-bold mb-1" x-text="t('firstName')">Prénom :</label>
                                    <input type="text" x-model="salon.firstName" placeholder="Thomas" required class="w-full px-3 py-2 rounded-xl border dark:bg-gray-800 text-sm">
                                </div>
                                <div>
                                    <label class="block font-bold mb-1" x-text="t('lastName')">Nom :</label>
                                    <input type="text" x-model="salon.lastName" placeholder="Barber" required class="w-full px-3 py-2 rounded-xl border dark:bg-gray-800 text-sm">
                                </div>
                            </div>
                            <div>
                                <label class="block font-bold mb-1" x-text="t('phonePro')">Numéro de téléphone pro :</label>
                                <div class="flex space-x-2">
                                    <select x-model="salon.countryCode" class="w-36 px-2 py-2 rounded-xl border dark:bg-gray-800 font-bold text-primary">
                                        <option value="+32">🇧🇪 +32</option>
                                        <option value="+33">🇫🇷 +33</option>
                                        <option value="+41">🇨🇭 +41</option>
                                        <option value="+352">🇱🇺 +352</option>
                                        <option value="+1">🇺🇸/🇨🇦 +1</option>
                                        <option value="+44">🇬🇧 +44</option>
                                        <option value="+212">🇲🇦 +212</option>
                                    </select>
                                    <input type="tel" x-model="salon.phone" placeholder="470123456" required class="flex-grow px-3 py-2 rounded-xl border dark:bg-gray-800 text-sm">
                                </div>
                            </div>
                            <div>
                                <label class="block font-bold mb-1" x-text="t('salonName')">Nom de votre Salon :</label>
                                <input type="text" x-model="salon.name" placeholder="Fade Master Studio" required class="w-full px-3 py-2 rounded-xl border dark:bg-gray-800 text-sm">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block font-bold mb-1" x-text="t('emailLabel')">Email pro :</label>
                                    <input type="email" x-model="salon.email" placeholder="coiffeur@gmail.com" required class="w-full px-3 py-2 rounded-xl border dark:bg-gray-800 text-sm">
                                </div>
                                <div>
                                    <label class="block font-bold mb-1" x-text="t('passwordLabel')">Mot de passe :</label>
                                    <input type="password" x-model="salon.password" placeholder="••••••••" required class="w-full px-3 py-2 rounded-xl border dark:bg-gray-800 text-sm">
                                </div>
                            </div>
                        </div>

                        <!-- SECTION PAIEMENT SÉCURISÉ STRIPE (ESSAI 5 JOURS) -->
                        <div class="p-5 bg-blue-50/50 dark:bg-gray-700/40 rounded-2xl border border-blue-200 dark:border-blue-800 space-y-4">
                            <h3 class="font-bold text-sm text-primary uppercase flex items-center justify-between">
                                <span>💳 2. Sécurisation de l'essai (Stripe)</span>
                                <span class="bg-blue-100 text-primary text-[10px] px-2 py-0.5 rounded-full">0 € débité aujourd'hui</span>
                            </h3>
                            <p class="text-xs text-gray-500">Pour valider vos 5 jours d'essai gratuit, enregistrez votre carte bancaire. Aucun prélèvement ne sera effectué avant la fin des 5 jours (49,99 €/mois ensuite, résiliable à tout moment).</p>
                            
                            <div class="p-4 bg-white dark:bg-gray-800 rounded-xl border space-y-3">
                                <div>
                                    <label class="block font-semibold mb-1">Numéro de carte (Stripe Elements) :</label>
                                    <input type="text" placeholder="4000 0000 0000 0000" required class="w-full px-3 py-2 rounded-lg border dark:bg-gray-700 font-mono text-xs">
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="block font-semibold mb-1">Expiration :</label>
                                        <input type="text" placeholder="MM/AA" required class="w-full px-3 py-2 rounded-lg border dark:bg-gray-700 font-mono text-xs">
                                    </div>
                                    <div>
                                        <label class="block font-semibold mb-1">CVC :</label>
                                        <input type="text" placeholder="123" required class="w-full px-3 py-2 rounded-lg border dark:bg-gray-700 font-mono text-xs">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-4 rounded-xl shadow-xl transition text-sm" x-text="t('validateConfig')">
                            Valider et démarrer mes 5 jours offerts 🚀
                        </button>
                    </form>
                </div>
            </div>
        </template>

        <!-- 3. DASHBOARD INDÉPENDANT PRO -->
        <template x-if="currentView === 'dashboard'">
            <div class="max-w-7xl mx-auto px-4 py-8 space-y-8">
                <!-- BANDEAU ALERTE ESSAI OU ABONNEMENT EXPIRÉ -->
                <template x-if="subscription.status === 'trial'">
                    <div class="bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 p-4 rounded-2xl flex flex-col sm:flex-row justify-between items-center gap-3">
                        <div class="flex items-center space-x-3">
                            <span class="text-2xl">⏳</span>
                            <div>
                                <h4 class="font-bold text-amber-800 dark:text-amber-300 text-sm">Période d'essai en cours (<span x-text="subscription.trialDaysLeft"></span> jours restants)</h4>
                                <p class="text-xs text-amber-700 dark:text-amber-400">Votre abonnement à 49,99 €/mois débutera automatiquement à la fin de votre essai.</p>
                            </div>
                        </div>
                        <button @click="simulateTrialEnd()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-4 py-2 rounded-xl text-xs shadow">
                            Simuler la fin des 5 jours ⚙️
                        </button>
                    </div>
                </template>

                <template x-if="subscription.status === 'expired'">
                    <div class="bg-red-50 dark:bg-red-950/40 border border-red-300 dark:border-red-800 p-6 rounded-2xl text-center space-y-4 shadow-xl">
                        <div class="text-3xl">⚠️</div>
                        <h3 class="text-xl font-black text-red-700 dark:text-red-300">Votre période d'essai de 5 jours est expirée</h3>
                        <p class="text-xs text-gray-600 dark:text-gray-300 max-w-lg mx-auto">Pour continuer à profiter de votre agenda FADELY, de votre lien unique et de vos rappels SMS automatiques, activez votre abonnement mensuel (49,99 €/mois).</p>
                        <button @click="paySubscription()" class="bg-primary hover:bg-primary-dark text-white font-bold px-8 py-3.5 rounded-xl shadow-lg text-sm">
                            Activer mon abonnement Stripe (49,99 €) 💳
                        </button>
                    </div>
                </template>

                <!-- En-tête -->
                <div class="bg-blue-50 dark:bg-gray-800 p-6 rounded-2xl shadow border flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                        <h2 class="text-2xl font-bold" x-text="salon.name"></h2>
                        <p class="text-sm text-gray-500" x-text="(selectedLang === 'en' ? 'Pro Artisan: ' : 'Artisan Pro : ') + salon.firstName + ' ' + salon.lastName"></p>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="bg-primary text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow" x-text="t('activeEdition')">✂️ Édition Indépendante Active</span>
                        <button @click="currentView = 'public_booking'" class="text-xs bg-green-600 text-white font-bold px-3 py-1.5 rounded-lg shadow" x-text="t('clientPage')">🔗 Page Client</button>
                    </div>
                </div>

                <!-- 🗂️ ONGLETS (Desktop) -->
                <div class="hidden sm:flex space-x-2 border-b dark:border-gray-700 pb-2 overflow-x-auto">
                    <button @click="dashboardTab = 'agenda'" class="px-5 py-2.5 rounded-xl font-bold text-sm transition" :class="dashboardTab === 'agenda' ? 'bg-primary text-white shadow' : 'bg-gray-100 dark:bg-gray-800 text-gray-600'" x-text="t('tabAgenda')">📅 Mon Agenda</button>
                    <button @click="dashboardTab = 'stats'" class="px-5 py-2.5 rounded-xl font-bold text-sm transition" :class="dashboardTab === 'stats' ? 'bg-primary text-white shadow' : 'bg-gray-100 dark:bg-gray-800 text-gray-600'" x-text="t('tabStats')">📈 Statistiques CA</button>
                    <button @click="dashboardTab = 'reminders'" class="px-5 py-2.5 rounded-xl font-bold text-sm transition relative" :class="dashboardTab === 'reminders' ? 'bg-primary text-white shadow' : 'bg-gray-100 dark:bg-gray-800 text-gray-600'" x-text="t('tabReminders')">🤖 Rappels SMS Auto</button>
                    <button @click="dashboardTab = 'settings'" class="px-5 py-2.5 rounded-xl font-bold text-sm transition" :class="dashboardTab === 'settings' ? 'bg-primary text-white shadow' : 'bg-gray-100 dark:bg-gray-800 text-gray-600'" x-text="t('tabSettings')">⚙️ Modifier Salon & Vacances</button>
                    <button @click="dashboardTab = 'billing'" class="px-5 py-2.5 rounded-xl font-bold text-sm transition" :class="dashboardTab === 'billing' ? 'bg-primary text-white shadow' : 'bg-gray-100 dark:bg-gray-800 text-gray-600'">💳 Abonnement & Stripe</button>
                </div>

                <!-- ONGLET 1 : AGENDA -->
                <div x-show="dashboardTab === 'agenda'" class="grid grid-cols-1 lg:grid-cols-3 gap-8" :class="{ 'opacity-40 pointer-events-none': subscription.status === 'expired' }">
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow border space-y-4 h-fit">
                        <h3 class="font-bold text-base border-b pb-3 dark:border-gray-700" x-text="t('addApptTitle')">➕ Ajouter un rendez-vous</h3>

                        <template x-if="isSalonOnLeave()">
                            <div class="p-4 bg-red-50 text-red-600 rounded-xl text-center text-xs font-bold" x-text="t('onLeaveNotice')">
                                🏖️ Vous êtes en congé ou en vacances ce jour-là.
                            </div>
                        </template>

                        <form @submit.prevent="addManualAppointment()" class="space-y-3" x-show="!isSalonOnLeave()">
                            <div>
                                <label class="block text-xs font-semibold mb-1" x-text="t('clientName')">Nom du client :</label>
                                <input type="text" x-model="newAppt.clientName" placeholder="Karim" required class="w-full px-3 py-2 rounded-xl border dark:bg-gray-700 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold mb-1" x-text="t('clientPhone')">Téléphone :</label>

                changeDate(days) {
                    let d = new Date(this.selectedDate);
                    d.setDate(d.getDate() + days);
                    this.selectedDate = d.toISOString().split('T')[0];
                },

                addNewService() {
                    this.salon.services.push({ name: '', price: 20 });
                },

                addVacationPeriod() {
                    if (!this.tempVacationStart || !this.tempVacationEnd) {
                        alert('⚠️ Veuillez renseigner une date de début et de fin de congé.');
                        return;
                    }
                    this.salonSettings.vacations.push({ start: this.tempVacationStart, end: this.tempVacationEnd });
                    this.tempVacationStart = '';
                    this.tempVacationEnd = '';
                },

                isSalonOnLeave(checkDate = this.selectedDate) {
                    let dateObj = new Date(checkDate);
                    let days = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
                    if (this.salonSettings.offDays.includes(days[dateObj.getDay()])) return true;
                    
                    for (let vac of this.salonSettings.vacations) {
                        if (checkDate >= vac.start && checkDate <= vac.end) return true;
                    }
                    return false;
                },

                isTimeInLunchBreak(timeStr) {
                    if (!this.salonSettings.hasLunchBreak) return false;
                    return timeStr >= this.salonSettings.lunchStart && timeStr < this.salonSettings.lunchEnd;
                },

                get generatedTimeSlots() {
                    let slots = [];
                    let startParts = this.salonSettings.startHour.split(':');
                    let endParts = this.salonSettings.endHour.split(':');
                    let startMinutes = (parseInt(startParts[0]) || 10) * 60 + (parseInt(startParts[1]) || 0);
                    let endMinutes = (parseInt(endParts[0]) || 19) * 60 + (parseInt(endParts[1]) || 0);
                    let step = parseInt(this.salonSettings.slotDuration) || 30;

                    for (let m = startMinutes; m < endMinutes; m += step) {
                        let h = Math.floor(m / 60);
                        let min = m % 60;
                        let timeStr = String(h).padStart(2, '0') + ':' + String(min).padStart(2, '0');

                        if (this.isTimeInLunchBreak(timeStr)) continue;

                        let matched = this.appointments.find(a => a.date === this.selectedDate && a.time === timeStr);
                        slots.push({ time: timeStr, booked: !!matched, appointment: matched || null });
                    }
                    return slots;
                },

                getClientAvailableSlots(targetDate) {
                    if (this.isSalonOnLeave(targetDate)) return [];

                    let slots = [];
                    let startParts = this.salonSettings.startHour.split(':');
                    let endParts = this.salonSettings.endHour.split(':');
                    let startMinutes = (parseInt(startParts[0]) || 10) * 60 + (parseInt(startParts[1]) || 0);
                    let endMinutes = (parseInt(endParts[0]) || 19) * 60 + (parseInt(endParts[1]) || 0);
                    let step = parseInt(this.salonSettings.slotDuration) || 30;

                    for (let m = startMinutes; m < endMinutes; m += step) {
                        let h = Math.floor(m / 60);
                        let min = m % 60;
                        let timeStr = String(h).padStart(2, '0') + ':' + String(min).padStart(2, '0');

                        if (this.isTimeInLunchBreak(timeStr)) continue;

                        let isBooked = this.appointments.some(a => a.date === targetDate && a.time === timeStr);
                        if (!isBooked) slots.push(timeStr);
                    }
                    return slots;
                },

                addManualAppointment() {
                    if (this.isSalonOnLeave(this.selectedDate)) {
                        alert('⚠️ ' + (this.selectedLang === 'en' ? 'Cannot book: on leave!' : 'Impossible : vous êtes en congé !'));
                        return;
                    }
                    this.appointments.push({
                        id: Date.now(),
                        clientName: this.newAppt.clientName,
                        clientPhone: this.newAppt.clientPhone,
                        serviceName: this.newAppt.serviceName,
                        price: 20,
                        date: this.selectedDate,
                        time: this.newAppt.time,
                        status: this.selectedLang === 'en' ? 'Scheduled' : 'Prévu'
                    });
                    this.showSuccessModal = true;
                },

                clientBookAppointment() {
                    if (this.isSalonOnLeave(this.clientBooking.date)) {
                        alert('❌ ' + (this.selectedLang === 'en' ? 'Salon is closed on this date.' : 'Le salon est fermé à cette date.'));
                        return;
                    }
                    this.appointments.push({
                        id: Date.now(),
                        clientName: this.clientBooking.clientName,
                        clientPhone: this.clientBooking.clientPhone,
                        serviceName: this.clientBooking.serviceName,
                        price: 20,
                        date: this.clientBooking.date,
                        time: this.clientBooking.time,
                        status: this.selectedLang === 'en' ? 'Scheduled' : 'Prévu'
                    });
                    this.showSuccessModal = true;
                    this.currentView = 'dashboard';
                },

                simulateTrialEnd() {
                    this.subscription.status = 'expired';
                    this.subscription.trialDaysLeft = 0;
                    alert('⏰ Simulation : La période d\'essai de 5 jours a expiré. L\'accès est restreint jusqu\'au paiement Stripe.');
                },

                paySubscription() {
                    window.location.href = "https://buy.stripe.com/test_cNicN7df94yY0ly7YS4sE00";
                },

                get totalRevenue() {
                    return this.appointments.filter(a => a.status === 'Terminé' || a.status === 'Done').reduce((sum, a) => sum + Number(a.price), 0);
                },

                get totalCompletedCount() {
                    return this.appointments.filter(a => a.status === 'Terminé' || a.status === 'Done').length;
                },

                get chartData() {
                    let completed = this.appointments.filter(a => a.status === 'Terminé' || a.status === 'Done');
                    let result = {};

                    if (this.statsFilter === 'day') {
                        let hours = ['09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00'];
                        hours.forEach(h => result[h] = 0);
                        completed.filter(a => a.date === this.selectedDate).forEach(a => {
                            let hKey = a.time.split(':')[0] + ':00';
                            if (result[hKey] !== undefined) result[hKey] += Number(a.price);
                            else result[hKey] = Number(a.price);
                        });
                    } else if (this.statsFilter === 'week') {
                        for (let i = 6; i >= 0; i--) {
                            let d = new Date();
                            d.setDate(d.getDate() - i);
                            let dStr = d.toISOString().split('T')[0];
                            let label = d.toLocaleDateString(this.selectedLang, { weekday: 'short', day: 'numeric' });
                            result[label] = 0;
                            completed.filter(a => a.date === dStr).forEach(a => {
                                result[label] += Number(a.price);
                            });
                        }
                    } else if (this.statsFilter === 'month') {
                        for (let i = 29; i >= 0; i -= 5) {
                            let d = new Date();
                            d.setDate(d.getDate() - i);
                            let label = d.toLocaleDateString(this.selectedLang, { month: 'short', day: 'numeric' });
                            result[label] = 0;
                            completed.forEach(a => {
                                let aDate = new Date(a.date);
                                let diffDays = Math.abs((new Date() - aDate) / (1000 * 60 * 60 * 24));
                                if (diffDays >= i && diffDays < i + 5) {
                                    result[label] += Number(a.price);
                                }
                            });
                        }
                    } else if (this.statsFilter === 'year') {
                        let months = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin', 'Juil', 'Août', 'Sep', 'Oct', 'Nov', 'Déc'];
                        months.forEach(m => result[m] = 0);
                        completed.forEach(a => {
                            let monthIdx = new Date(a.date).getMonth();
                            let mName = months[monthIdx];
                            if (mName) result[mName] += Number(a.price);
                        });
                    }

                    return Object.keys(result).map(key => ({ label: key, value: result[key] }));
                },

                get maxChartValue() {
                    let vals = this.chartData.map(b => b.value);
                    return Math.max(...vals, 10);
                },

                toggleStatus(id) {
                    const appt = this.appointments.find(a => a.id === id);
                    if (appt) {
                        if (appt.status === 'Prévu' || appt.status === 'Scheduled') {
                            appt.status = this.selectedLang === 'en' ? 'Done' : 'Terminé';
                        } else {
                            appt.status = this.selectedLang === 'en' ? 'Scheduled' : 'Prévu';
                        }
                    }
                },

                deleteAppt(id) {
                    this.appointments = this.appointments.filter(a => a.id !== id);
                },

                get salonSlug() {
                    return (this.salon.firstName + '-' + this.salon.lastName).toLowerCase().replace(/[^a-z0-9]/g, '-');
                },

                copyMyLink() {
                    navigator.clipboard.writeText('fadely.app/salon/' + this.salonSlug);
                    alert('📋 ' + (this.selectedLang === 'en' ? 'Link copied!' : 'Lien copié !'));
                },

                finishRegistration() { this.currentView = 'dashboard'; },
                loginCoiffeur() { this.currentView = 'dashboard'; }
            }
        }
