<!DOCTYPE html>
<html lang="fr" x-data="fadelyApp()" x-init="initAutoReminders(); initPWA();" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FADELY - L'Agenda Pro des Coiffeurs & Barbiers Indépendants</title>
    
    <!-- PWA / Mobile Meta Tags -->
    <meta name="theme-color" content="#2563EB">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FADELY">
    
    <!-- Dynamic Manifest PWA -->
    <link rel="manifest" id="pwa-manifest">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#2563EB',
                            dark: '#1D4ED8',
                            light: '#EFF6FF'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Stripe.js -->
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300 min-h-screen flex flex-col font-sans pb-24 sm:pb-0">

    <!-- HEADER / NAVIGATION -->
    <header class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md shadow-sm sticky top-0 z-50 transition">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" @click="currentView = 'home'">
                <div class="bg-primary text-white p-2.5 rounded-2xl font-black text-xl tracking-wider shadow-md shadow-blue-500/20">F</div>
                <span class="text-2xl font-black tracking-tight text-primary dark:text-blue-400" x-text="salon.name || 'FADELY'">FADELY</span>
            </div>
            <div class="flex items-center space-x-4">
                <!-- Sélecteur de langue -->
                <select x-model="selectedLang" class="bg-gray-100 dark:bg-gray-700 text-xs font-bold px-3 py-2 rounded-xl border-0 cursor-pointer hover:bg-gray-200 transition">
                    <option value="fr">🇫🇷 FR</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="nl">🇳🇱 NL</option>
                    <option value="de">🇩🇪 DE</option>
                    <option value="es">🇪🇸 ES</option>
                    <option value="it">🇮🇹 IT</option>
                </select>

                <button @click="darkMode = !darkMode" class="p-2.5 rounded-xl bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition">
                    <svg x-show="!darkMode" class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    <svg x-show="darkMode" class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </button>

                <template x-if="currentView === 'home'">
                    <div class="flex items-center space-x-3">
                        <button @click="currentView = 'login'" class="text-xs font-bold hover:text-primary transition px-3 py-2">Connexion</button>
                        <button @click="currentView = 'register'" class="bg-primary hover:bg-primary-dark text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-lg shadow-blue-500/30 transition transform hover:-translate-y-0.5">Créer votre espace pro</button>
                    </div>
                </template>
                <template x-if="currentView !== 'home' && currentView !== 'public_booking'">
                    <button @click="logout()" class="text-xs font-bold text-gray-500 hover:text-red-500 transition px-3 py-2">Déconnexion</button>
                </template>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-grow">

        <!-- 1. PAGE D'ACCUEIL -->
        <template x-if="currentView === 'home'">
            <div class="space-y-20 pb-20">
                <section class="relative overflow-hidden pt-12 pb-16 md:py-24">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                            
                            <div class="lg:col-span-7 space-y-8 text-center lg:text-left">
                                <div class="inline-flex items-center space-x-2 bg-blue-50 dark:bg-blue-950/60 border border-blue-200 dark:border-blue-800 text-primary dark:text-blue-300 text-xs font-bold px-4 py-2 rounded-full shadow-sm">
                                    <span>✂️ La Plateforme Officielle des Artisans Indépendants</span>
                                </div>
                                
                                <h1 class="text-4xl sm:text-6xl font-black tracking-tight leading-tight">
                                    Remplissez votre agenda <br>
                                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 dark:from-blue-400 dark:to-indigo-400">sans perdre une minute.</span>
                                </h1>
                                
                                <p class="text-base sm:text-lg text-gray-600 dark:text-gray-300 max-w-2xl mx-auto lg:mx-0 leading-relaxed">
                                    Une réservation en ligne ultra-simple avec **votre propre lien unique**, zéro doublon, rappels SMS automatiques et créneaux sur-mesure.
                                </p>

                                <div class="flex flex-col sm:flex-row justify-center lg:justify-start items-center space-y-3 sm:space-y-0 sm:space-x-4">
                                    <button @click="currentView = 'register'" class="w-full sm:w-auto bg-primary hover:bg-primary-dark text-white px-8 py-4 rounded-2xl font-bold text-sm shadow-xl shadow-blue-500/30 transition transform hover:-translate-y-1">
                                        Accéder à votre espace pro 🚀
                                    </button>
                                    <button @click="currentView = 'public_booking'" class="w-full sm:w-auto bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 text-gray-800 dark:text-gray-100 px-8 py-4 rounded-2xl font-bold text-sm border border-gray-200 dark:border-gray-700 transition">
                                        Voir la démo client 📱
                                    </button>
                                </div>
                            </div>

                            <div class="lg:col-span-5 max-w-md mx-auto w-full">
                                <div class="bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-2xl border-2 border-primary relative space-y-6">
                                    <div class="absolute -top-3.5 right-6 bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-[11px] font-extrabold uppercase tracking-wider px-4 py-1 rounded-full shadow-md">
                                        Édition Indépendante Pro
                                    </div>
                                    
                                    <div class="space-y-2">
                                        <span class="text-xs font-bold uppercase tracking-wider text-primary">Offre Tout Inclus</span>
                                        <h3 class="text-3xl font-black">49,99 € <span class="text-xs font-normal text-gray-400">/ mois</span></h3>
                                        <p class="text-xs text-gray-500">Abonnement professionnel complet.</p>
                                    </div>

                                    <div class="border-t border-b dark:border-gray-700 py-4 space-y-3 text-xs font-medium">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-5 h-5 bg-blue-100 text-primary rounded-full flex items-center justify-center font-bold text-[10px]">✓</div>
                                            <span>Lien unique personnalisable (Instagram / TikTok)</span>
                                        </div>
                                        <div class="flex items-center space-x-3">
                                            <div class="w-5 h-5 bg-blue-100 text-primary rounded-full flex items-center justify-center font-bold text-[10px]">✓</div>
                                            <span>Gestion 100% Anti-Doublons en temps réel</span>
                                        </div>
                                    </div>

                                    <button @click="currentView = 'register'" class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-3.5 rounded-xl shadow-lg transition">
                                        Créer Votre Salon Maintenant 🚀
                                    </button>
                                </div>
                            </div>

                        </div>
                    </div>
                </section>
            </div>
        </template>

        <!-- 1.5 CONNEXION -->
        <template x-if="currentView === 'login'">
            <div class="max-w-md mx-auto px-4 py-16">
                <div class="bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-2xl border border-gray-100 dark:border-gray-700 space-y-6">
                    <div class="text-center space-y-2">
                        <div class="w-14 h-14 bg-primary text-white rounded-2xl flex items-center justify-center font-bold text-xl shadow-lg mx-auto">🔐</div>
                        <h2 class="text-2xl font-black">Connexion Professionnelle</h2>
                    </div>

                    <!-- Message d'erreur de connexion -->
                    <template x-if="loginError">
                        <div class="p-3 bg-red-50 text-red-600 rounded-xl text-xs font-bold text-center border border-red-200" x-text="loginError"></div>
                    </template>

                    <form @submit.prevent="loginCoiffeur()" class="space-y-4 text-xs">
                        <div>
                            <label class="block font-bold mb-1">Email pro :</label>
                            <input type="email" x-model="loginData.email" required class="w-full px-4 py-3 rounded-xl border dark:bg-gray-700">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">Mot de passe :</label>
                            <input type="password" x-model="loginData.password" required class="w-full px-4 py-3 rounded-xl border dark:bg-gray-700">
                        </div>
                        <button type="submit" class="w-full bg-primary text-white font-bold py-3.5 rounded-xl shadow transition">Se connecter 🚀</button>
                    </form>
                    <div class="text-center pt-2">
                        <button @click="currentView = 'register'" class="text-xs text-primary font-bold hover:underline">Pas encore de compte ? Créer mon espace</button>
                    </div>
                </div>
            </div>
        </template>

        <!-- 2. INSCRIPTION & CONFIGURATION -->
        <template x-if="currentView === 'register'">
            <div class="max-w-2xl mx-auto px-4 py-12">
                <div class="bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-2xl border space-y-8">
                    <div class="text-center space-y-2">
                        <span class="bg-blue-100 dark:bg-blue-900/50 text-primary text-xs font-bold px-3 py-1 rounded-full">Assistant de Configuration Professionnelle</span>
                        <h2 class="text-3xl font-black">Configurez votre salon FADELY</h2>
                        <p class="text-xs text-gray-500">Abonnement professionnel à 49,99 €/mois. Résiliable à tout moment.</p>
                    </div>

                    <form @submit.prevent="finishRegistration()" class="space-y-6 text-xs">
                        <div class="p-5 bg-gray-50 dark:bg-gray-700/40 rounded-2xl border space-y-4">
                            <h3 class="font-bold text-sm text-primary uppercase">1. Vos Informations & Téléphone</h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block font-bold mb-1">Prénom :</label>
                                    <input type="text" x-model="salon.firstName" placeholder="Thomas" required class="w-full px-3 py-2 rounded-xl border dark:bg-gray-800 text-sm">
                                </div>
                                <div>
                                    <label class="block font-bold mb-1">Nom :</label>
                                    <input type="text" x-model="salon.lastName" placeholder="Barber" required class="w-full px-3 py-2 rounded-xl border dark:bg-gray-800 text-sm">
                                </div>
                            </div>
                            <div>
                                <label class="block font-bold mb-1">Numéro de téléphone pro :</label>
                                <div class="flex space-x-2">
                                    <select x-model="salon.countryCode" class="w-36 px-2 py-2 rounded-xl border dark:bg-gray-800 font-bold text-primary">
                                        <option value="+32">🇧🇪 +32</option>
                                        <option value="+33">🇫🇷 +33</option>
                                        <option value="+41">🇨🇭 +41</option>
                                        <option value="+352">🇱🇺 +352</option>
                                        <option value="+1">🇺🇸/🇨🇦 +1</option>
                                        <option value="+44">🇬🇧 +44</option>
                                        <option value="+212">🇲🇦 +212</option>
                                    </select>
                                    <input type="tel" x-model="salon.phone" placeholder="470123456" required class="flex-grow px-3 py-2 rounded-xl border dark:bg-gray-800 text-sm">
                                </div>
                            </div>
                            <div>
                                <label class="block font-bold mb-1">Nom de votre Salon :</label>
                                <input type="text" x-model="salon.name" placeholder="Fade Master Studio" required class="w-full px-3 py-2 rounded-xl border dark:bg-gray-800 text-sm">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block font-bold mb-1">Email pro :</label>
                                    <input type="email" x-model="salon.email" placeholder="coiffeur@gmail.com" required class="w-full px-3 py-2 rounded-xl border dark:bg-gray-800 text-sm">
                                </div>
                                <div>
                                    <label class="block font-bold mb-1">Mot de passe :</label>
                                    <input type="password" x-model="salon.password" placeholder="••••••••" required class="w-full px-3 py-2 rounded-xl border dark:bg-gray-800 text-sm">
                                </div>
                            </div>
                        </div>

                        <!-- SECTION PAIEMENT SÉCURISÉ STRIPE -->
                        <div class="p-5 bg-blue-50/50 dark:bg-gray-700/40 rounded-2xl border border-blue-200 dark:border-blue-800 space-y-4">
                            <h3 class="font-bold text-sm text-primary uppercase flex items-center justify-between">
                                <span>💳 2. Paiement Sécurisé (Stripe)</span>
                                <span class="bg-blue-100 text-primary text-[10px] px-2 py-0.5 rounded-full">49,99 € / mois</span>
                            </h3>
                            <p class="text-xs text-gray-500">Renseignez vos coordonnées bancaires pour activer instantanément votre accès professionnel.</p>
                            
                            <div class="p-4 bg-white dark:bg-gray-800 rounded-xl border space-y-3">
                                <div>
                                    <label class="block font-semibold mb-1">Numéro de carte (Stripe Elements) :</label>
                                    <input type="text" placeholder="4000 0000 0000 0000" required class="w-full px-3 py-2 rounded-lg border dark:bg-gray-700 font-mono text-xs">
                                </div>
                                <div class="grid grid-cols-2 gap-3">
                                    <div>
                                        <label class="block font-semibold mb-1">Expiration :</label>
                                        <input type="text" placeholder="MM/AA" required class="w-full px-3 py-2 rounded-lg border dark:bg-gray-700 font-mono text-xs">
                                    </div>
                                    <div>
                                        <label class="block font-semibold mb-1">CVC :</label>
                                        <input type="text" placeholder="123" required class="w-full px-3 py-2 rounded-lg border dark:bg-gray-700 font-mono text-xs">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-4 rounded-xl shadow-xl transition text-sm">
                            Activer mon compte professionnel 🚀
                        </button>
                    </form>
                </div>
            </div>
        </template>

        <!-- 3. DASHBOARD INDÉPENDANT PRO -->
        <template x-if="currentView === 'dashboard'">
            <div class="max-w-7xl mx-auto px-4 py-8 space-y-8">
                <!-- En-tête -->
                <div class="bg-blue-50 dark:bg-gray-800 p-6 rounded-2xl shadow border flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                        <h2 class="text-2xl font-bold" x-text="salon.name"></h2>
                        <p class="text-sm text-gray-500" x-text="'Artisan Pro : ' + salon.firstName + ' ' + salon.lastName"></p>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span class="bg-primary text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow">✂️ Édition Indépendante Active</span>
                        <button @click="currentView = 'public_booking'" class="text-xs bg-green-600 text-white font-bold px-3 py-1.5 rounded-lg shadow">🔗 Page Client</button>
                    </div>
                </div>

                <!-- 🗂️ ONGLETS (Desktop) -->
                <div class="hidden sm:flex space-x-2 border-b dark:border-gray-700 pb-2 overflow-x-auto">
                    <button @click="dashboardTab = 'agenda'" class="px-5 py-2.5 rounded-xl font-bold text-sm transition" :class="dashboardTab === 'agenda' ? 'bg-primary text-white shadow' : 'bg-gray-100 dark:bg-gray-800 text-gray-600'">📅 Mon Agenda</button>
                    <button @click="dashboardTab = 'stats'" class="px-5 py-2.5 rounded-xl font-bold text-sm transition" :class="dashboardTab === 'stats' ? 'bg-primary text-white shadow' : 'bg-gray-100 dark:bg-gray-800 text-gray-600'">📈 Statistiques CA</button>
                    <button @click="dashboardTab = 'reminders'" class="px-5 py-2.5 rounded-xl font-bold text-sm transition relative" :class="dashboardTab === 'reminders' ? 'bg-primary text-white shadow' : 'bg-gray-100 dark:bg-gray-800 text-gray-600'">🤖 Rappels SMS Auto</button>
                    <button @click="dashboardTab = 'settings'" class="px-5 py-2.5 rounded-xl font-bold text-sm transition" :class="dashboardTab === 'settings' ? 'bg-primary text-white shadow' : 'bg-gray-100 dark:bg-gray-800 text-gray-600'">⚙️ Modifier Salon & Vacances</button>
                    <button @click="dashboardTab = 'billing'" class="px-5 py-2.5 rounded-xl font-bold text-sm transition" :class="dashboardTab === 'billing' ? 'bg-primary text-white shadow' : 'bg-gray-100 dark:bg-gray-800 text-gray-600'">💳 Abonnement & Stripe</button>
                </div>

                <!-- ONGLET 1 : AGENDA -->
                <div x-show="dashboardTab === 'agenda'" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow border space-y-4 h-fit">
                        <h3 class="font-bold text-base border-b pb-3 dark:border-gray-700">➕ Ajouter un rendez-vous</h3>

                        <form @submit.prevent="addManualAppointment()" class="space-y-3">
                            <div>
                                <label class="block text-xs font-semibold mb-1">Nom du client :</label>
                                <input type="text" x-model="newAppt.clientName" placeholder="Karim" required class="w-full px-3 py-2 rounded-xl border dark:bg-gray-700 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold mb-1">Téléphone :</label>
                                <input type="tel" x-model="newAppt.clientPhone" placeholder="600000000" required class="w-full px-3 py-2 rounded-xl border dark:bg-gray-700 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold mb-1">Prestation :</label>
                                <select x-model="newAppt.serviceName" class="w-full px-3 py-2 rounded-xl border dark:bg-gray-700 text-sm">
                                    <template x-for="srv in salon.services">
                                        <option :value="srv.name" x-text="srv.name + ' (' + srv.price + ' €)'"></option>
                                    </template>
                                </select>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <input type="date" x-model="selectedDate" required class="px-2 py-2 rounded-xl border dark:bg-gray-700 text-xs">
                                <input type="time" x-model="newAppt.time" required class="px-2 py-2 rounded-xl border dark:bg-gray-700 text-xs">
                            </div>
                            <button type="submit" class="w-full bg-primary text-white font-bold py-2.5 rounded-xl shadow text-sm">Ajouter au planning</button>
                        </form>
                    </div>

                    <div class="lg:col-span-2 bg-white dark:bg-gray-800 p-6 rounded-2xl shadow border space-y-6">
                        <div class="flex flex-col sm:flex-row justify-between items-center bg-gray-50 dark:bg-gray-700/50 p-4 rounded-xl gap-4">
                            <div class="flex items-center space-x-3">
                                <button @click="changeDate(-1)" class="p-2 bg-white dark:bg-gray-800 rounded-xl shadow border font-bold hover:bg-gray-100 transition">◀ Jour Précédent</button>
                                <button @click="changeDate(1)" class="p-2 bg-white dark:bg-gray-800 rounded-xl shadow border font-bold hover:bg-gray-100 transition">Jour Suivant ▶</button>
                            </div>
                            <input type="date" x-model="selectedDate" class="px-4 py-2 rounded-xl border dark:bg-gray-800 text-xs font-bold ring-2 ring-blue-500/50">
                        </div>

                        <!-- LISTE DES CRÉNEAUX -->
                        <div class="space-y-3 max-h-[500px] overflow-y-auto pr-2">
                            <template x-for="slot in generatedTimeSlots" :key="slot.time">
                                <div class="flex items-center justify-between p-3.5 rounded-2xl border" :class="slot.booked ? 'bg-blue-50/70 dark:bg-blue-900/30 border-blue-200' : 'bg-gray-50 dark:bg-gray-700/30'">
                                    <div class="flex items-center space-x-4">
                                        <div class="font-mono font-bold text-sm px-2.5 py-1.5 rounded-xl text-white" :class="slot.booked ? 'bg-primary' : 'bg-gray-400'" x-text="slot.time"></div>
                                        <template x-if="slot.booked">
                                            <div class="space-y-0.5">
                                                <div class="flex items-center space-x-2">
                                                    <p class="font-bold text-sm" x-text="slot.appointment.clientName + ' (' + slot.appointment.clientPhone + ')'"></p>
                                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wide bg-blue-100 text-blue-700" x-text="slot.appointment.status"></span>
                                                </div>
                                                <p class="text-xs text-gray-500" x-text="slot.appointment.serviceName + ' • ' + slot.appointment.price + ' €'"></p>
                                            </div>
                                        </template>
                                        <template x-if="!slot.booked">
                                            <p class="text-xs text-gray-400 italic">Créneau disponible</p>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- ONGLET ABONNEMENT & STRIPE -->
                <div x-show="dashboardTab === 'billing'" class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow border space-y-6 max-w-2xl mx-auto">
                    <h3 class="font-bold text-lg border-b pb-3 dark:border-gray-700">💳 Gestion de l'Abonnement Mensuel</h3>
                    <div class="p-4 bg-gray-50 dark:bg-gray-700/50 rounded-xl space-y-2">
                        <div class="flex justify-between text-sm font-bold">
                            <span>Formule Active :</span>
                            <span class="text-primary">Fadely Pro Indépendant (49,99 € / mois)</span>
                        </div>
                        <div class="flex justify-between text-xs text-gray-500">
                            <span>Statut du compte :</span>
                            <span class="text-green-600 font-bold">ACTIF ET SÉCURISÉ (PROD)</span>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white dark:bg-gray-800 border-t dark:border-gray-700 py-8 text-center text-xs text-gray-500 space-y-2 mt-auto">
        <p>© 2026 FADELY - Tous droits réservés. L'Agenda Pro des Artisans Coiffeurs & Barbiers.</p>

    <script>

            return {
                currentView: 'home',
                dashboardTab: 'agenda',
                darkMode: false,
                selectedLang: 'fr',
                loginError: '',
                salon: {
                    name: 'Fade Master Studio',
                    firstName: 'Thomas',
                    lastName: 'Barber',
                    phone: '470123456',
                    countryCode: '+32',
                    email: 'coiffeur@gmail.com',
                    password: 'password123', // Mot de passe par défaut sécurisé
                    services: [
                        { name: 'Coupe Classique', price: 25 },
                        { name: 'Dégradé Américain (Fade)', price: 30 },
                        { name: 'Barbe & Soins', price: 20 },
                        { name: 'Combo Coupe + Barbe', price: 45 }
                    ]
                },
                loginData: { email: '', password: '' },
                selectedDate: new Date().toISOString().split('T')[0],
                newAppt: { clientName: '', clientPhone: '', serviceName: 'Coupe Classique', time: '10:00' },
                
                initAutoReminders() {},
                initPWA() {},
                changeDate(days) {
                    let d = new Date(this.selectedDate);
                    d.setDate(d.getDate() + days);
                    this.selectedDate = d.toISOString().split('T')[0];
                },
                get generatedTimeSlots() {
                    return [
                        { time: '09:00', booked: false },
                        { time: '10:00', booked: true, appointment: { clientName: 'Karim', clientPhone: '0600000000', serviceName: 'Dégradé Américain (Fade)', price: 30, status: 'Confirmé' } },
                        { time: '11:00', booked: false },
                        { time: '14:00', booked: false },
                        { time: '15:00', booked: false }
                    ];
                },
                loginCoiffeur() {
                    this.loginError = '';
                    // Vérification stricte des identifiants
                    if (this.loginData.email.trim().toLowerCase() === this.salon.email.trim().toLowerCase() && 
                        this.loginData.password === this.salon.password) {
                        this.currentView = 'dashboard';
                    } else {
                        this.loginError = "❌ Email pro ou mot de passe incorrect. Veuillez réessayer.";
                    }
                },
                finishRegistration() {
                    if(!this.salon.email || !this.salon.password) return;
                    // Sauvegarde des nouveaux identifiants saisis lors de l'inscription
                    this.currentView = 'dashboard';
                },
                logout() {
                    this.loginData = { email: '', password: '' };
                    this.loginError = '';
                    this.currentView = 'home';
                },
                addManualAppointment() {
                    if(!this.newAppt.clientName) return;
                    this.newAppt = { clientName: '', clientPhone: '', serviceName: 'Coupe Classique', time: '10:00' };
                }
            }
        }
    </script>
